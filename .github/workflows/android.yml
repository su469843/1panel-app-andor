name: Build APK

# 在 GitHub 云端构建 APK —— 本地（1 核 1G）永远不需要跑 Gradle。
# 触发方式：push 到 main/master、手动 workflow_dispatch、或提 PR。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Static self-check (XML / resources / Kotlin imports)
        run: node tools/check-static.mjs

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug + release APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PanelOne-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## 构建产物"
            echo ""
            find app/build/outputs/apk -name '*.apk' -printf '%p  %k KB\n' 2>/dev/null || true
            echo ""
            echo "在 Actions 页面本任务的 Artifacts 区域下载 **PanelOne-apk**。"
          } >> "$GITHUB_STEP_SUMMARY"
